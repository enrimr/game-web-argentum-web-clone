server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Comprimir respuestas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Servir archivos estáticos directamente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Servir el directorio /admin como archivos estáticos
    location /admin/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Servir el directorio /manual como archivos estáticos
    location /manual/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Servir el directorio /api como archivos estáticos (para env.js)
    location /api/ {
        try_files $uri $uri/ =404;
    }

    # Servir directorios de recursos estáticos
    location /img/ {
        try_files $uri =404;
    }

    location /resources/ {
        try_files $uri =404;
    }

    location /styles/ {
        try_files $uri =404;
    }

    # Para la raíz y todas las demás rutas, servir index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manejo de errores
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}